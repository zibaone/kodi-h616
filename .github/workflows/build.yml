name: build-aarch64

# Vérifie trois choses sur un runner ARM natif, sans nixbian ni noyau :
#   1. le disque : la fermeture tient-elle sur le runner (/mnt monté sur /nix) ?
#   2. la durée réelle de ffmpeg + kodi, comparée aux 12 h+ en émulation ;
#   3. que le gate hwconfig passe sur aarch64 (il n'avait été validé qu'en x86).
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Disque — monter /mnt sur /nix si c'est un volume séparé
        run: |
          echo "=== avant ==="
          df -h / /mnt || true
          if [ -d /mnt ] && [ "$(df --output=target /mnt | tail -1)" = "/mnt" ]; then
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
            echo "=== /nix monté sur /mnt ==="
          else
            echo "=== /mnt absent ou sur le même fs que / : le disque racine suffit ==="
          fi
          df -h / || true
          echo "cpu: $(nproc) | ram: $(free -g | awk '/^Mem:/{print $2}') Go"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4
            cores = 0

      # Publication vers havenos.cachix.org. Deux secrets sont nécessaires :
      #   CACHIX_AUTH_TOKEN   — token « read and write » du cache ;
      #   CACHIX_SIGNING_KEY  — clé de signature côté client (le cache refuse
      #                         un narinfo non signé : 400 « This cache
      #                         requires client-side signing »).
      # Sans le second, cachix-action échoue en post-traitement : c'est
      # pourquoi `skipPush` avait été posé, puis retiré une fois la clé en
      # place. Ne pas remettre l'un sans l'autre.
      - uses: cachix/cachix-action@v17
        with:
          name: havenos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Environnement
        run: |
          nix --version
          uname -m
          df -h /nix

      - name: Build ffmpeg v4l2-request (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.ffmpeg-v4l2request
          d=$(( $(date +%s) - s ))
          echo "| ffmpeg | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build kodi 21.3 + backport (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.kodi
          d=$(( $(date +%s) - s ))
          echo "| kodi | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate hwconfig (h264 + hevc → DRM_PRIME / HW_DEVICE_CTX / DRM)
        run: |
          s=$(date +%s)
          nix build -L .#checks.aarch64-linux.hwconfig
          cat result | tee -a "$GITHUB_STEP_SUMMARY"
          d=$(( $(date +%s) - s ))
          echo "| gate | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      # Fermeture kiosque : les paquets *système* de l'image (mesa, pipewire,
      # wlroots, v4l-utils, ffmpeg-headless, sdl3) construits avec les deux
      # overlays. C'est ce qui alimente le cache pour l'assemblage local —
      # sans ça, un trim d'image se recompile sous qemu (mesa : 1 h 30).
      - name: Build fermeture kiosque (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#checks.aarch64-linux.kiosk-closure
          d=$(( $(date +%s) - s ))
          echo "| kiosk-closure | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      # Le daemon de cachix-action annonce « Pushed » des chemins qu'il
      # n'envoie jamais : sur le run 39595259213, ffmpeg-*-bin et ffmpeg-*
      # sont restés absents du cache (404) malgré un log « Pushed » et zéro
      # erreur. On ne fait donc pas confiance au post-traitement pour les
      # sorties qui comptent : push explicite de la fermeture, puis contrôle
      # du narinfo — le badge vert ne prouve rien.
      - name: Publier les sorties au cache (explicite)
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          paths=$(nix path-info -r \
            .#packages.aarch64-linux.kodi \
            .#packages.aarch64-linux.ffmpeg-v4l2request \
            .#checks.aarch64-linux.kiosk-closure | tr '\n' ' ')
          cachix push havenos $paths
          echo "— contrôle des sorties attendues —"
          for p in \
            $(nix path-info .#packages.aarch64-linux.kodi) \
            $(nix path-info .#packages.aarch64-linux.ffmpeg-v4l2request) \
            $(nix path-info .#checks.aarch64-linux.kiosk-closure); do
            h=$(basename "$p" | cut -c1-32)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://havenos.cachix.org/$h.narinfo")
            echo "$code  $(basename "$p")"
            test "$code" = "200"
          done

      - name: Mesures (tailles réelles)
        run: |
          {
            echo "| paquet | taille |"
            echo "|---|---|"
            nix path-info -S .#packages.aarch64-linux.ffmpeg-v4l2request .#packages.aarch64-linux.kodi |
              awk '{printf "| %s | %.1f Mio |\n", $1, $2/1048576}'
            echo
            echo "fermeture kodi (sortie « out ») : $(nix path-info -S --json .#packages.aarch64-linux.kodi | jq -r '[.[].closureSize] | max / 1073741824 | "\(. * 100 | round / 100) Gio"')"
            echo
            df -h /nix
          } | tee rapport.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport
          path: rapport.txt
