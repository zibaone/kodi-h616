name: build

# Trois vérifications, sur runner ARM natif, sans nixbian ni noyau :
#   1. le contrat hwaccel (h264 + hevc → DRM_PRIME / HW_DEVICE_CTX / DRM) ;
#   2. que la fermeture kiosque se construise et atterrisse au cache ;
#   3. le formatage et l'évaluation complète du flake (`nix flake check`).
#
# Plus un job x86_64 sur runner GitHub standard : le gate hwconfig y était
# annoncé « passe » dans le README sans qu'aucune CI ne le construise.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
  workflow_dispatch:

# Un push pendant un build de 50 min ne doit pas en lancer un second.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Disque — monter /mnt sur /nix si c'est un volume séparé
        run: |
          echo "=== avant ==="
          df -h / /mnt || true
          if [ -d /mnt ] && [ "$(df --output=target /mnt | tail -1)" = "/mnt" ]; then
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
            echo "=== /nix monté sur /mnt ==="
          else
            echo "=== /mnt absent ou sur le même fs que / : le disque racine suffit ==="
          fi
          df -h / || true
          echo "cpu: $(nproc) | ram: $(free -g | awk '/^Mem:/{print $2}') Go"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4
            cores = 0

      # Publication vers havenos.cachix.org. Deux secrets sont nécessaires :
      #   CACHIX_AUTH_TOKEN   — token « read and write » du cache ;
      #   CACHIX_SIGNING_KEY  — clé de signature côté client (le cache refuse
      #                         un narinfo non signé : 400 « This cache
      #                         requires client-side signing »).
      # Sans le second, cachix-action échoue en post-traitement : c'est
      # pourquoi `skipPush` avait été posé, puis retiré une fois la clé en
      # place. Ne pas remettre l'un sans l'autre.
      #
      # Sur une PR venue d'un fork, les secrets sont absents : on saute la
      # publication, la construction reste vérifiée.
      - uses: cachix/cachix-action@v17
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          name: havenos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'
          signingKey: '${{ secrets.CACHIX_SIGNING_KEY }}'

      - name: Environnement
        run: |
          nix --version
          uname -m
          df -h /nix

      - name: Formatage et évaluation (`nix flake check`)
        run: nix flake check -L

      - name: Build ffmpeg v4l2-request (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.ffmpeg-v4l2request
          d=$(( $(date +%s) - s ))
          echo "| ffmpeg | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build kodi 21.3 + backport (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.kodi
          d=$(( $(date +%s) - s ))
          echo "| kodi | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      # Variante consommée par l'image : kodi lié aux paquets système élagués,
      # sans seconde copie de pipewire. Si elle n'est pas construite ici, elle
      # n'est pas au cache et l'image la recompile sous qemu.
      - name: Build kodi variante kiosque (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.kodi-kiosk
          d=$(( $(date +%s) - s ))
          echo "| kodi-kiosk | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate hwconfig (h264 + hevc → DRM_PRIME / HW_DEVICE_CTX / DRM)
        run: |
          s=$(date +%s)
          nix build -L .#checks.aarch64-linux.hwconfig
          cat result | tee -a "$GITHUB_STEP_SUMMARY"
          d=$(( $(date +%s) - s ))
          echo "| gate | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      # Fermeture kiosque : les paquets *système* de l'image (cage, mesa,
      # pipewire, wireplumber, wlroots, v4l-utils, ffmpeg-headless) construits
      # avec les deux overlays. C'est ce qui alimente le cache pour
      # l'assemblage local — sans ça, un trim d'image se recompile sous qemu
      # (mesa : 1 h 30).
      - name: Build fermeture kiosque (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#checks.aarch64-linux.kiosk-closure
          d=$(( $(date +%s) - s ))
          echo "| kiosk-closure | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      # Le daemon de cachix-action annonce « Pushed » des chemins qu'il
      # n'envoie jamais : sur le run 39595259213, ffmpeg-*-bin et ffmpeg-*
      # sont restés absents du cache (404) malgré un log « Pushed » et zéro
      # erreur. On ne fait donc pas confiance au post-traitement pour les
      # sorties qui comptent : push explicite de la fermeture, puis contrôle
      # du narinfo — le badge vert ne prouve rien.
      - name: Publier les sorties au cache (explicite)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_SIGNING_KEY: ${{ secrets.CACHIX_SIGNING_KEY }}
        run: |
          set -euo pipefail
          paths=$(nix path-info -r \
            .#packages.aarch64-linux.kodi \
            .#packages.aarch64-linux.kodi-kiosk \
            .#packages.aarch64-linux.ffmpeg-v4l2request \
            .#checks.aarch64-linux.kiosk-closure | tr '\n' ' ')
          cachix push havenos $paths
          echo "— contrôle des sorties attendues —"
          for p in \
            $(nix path-info .#packages.aarch64-linux.kodi) \
            $(nix path-info .#packages.aarch64-linux.kodi-kiosk) \
            $(nix path-info .#packages.aarch64-linux.ffmpeg-v4l2request) \
            $(nix path-info .#checks.aarch64-linux.kiosk-closure); do
            h=$(basename "$p" | cut -c1-32)
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://havenos.cachix.org/$h.narinfo")
            echo "$code  $(basename "$p")"
            test "$code" = "200"
          done

      - name: Mesures (tailles réelles)
        run: |
          {
            echo "| paquet | taille |"
            echo "|---|---|"
            nix path-info -S .#packages.aarch64-linux.ffmpeg-v4l2request .#packages.aarch64-linux.kodi .#packages.aarch64-linux.kodi-kiosk |
              awk '{printf "| %s | %.1f Mio |\n", $1, $2/1048576}'
            echo
            df -h /nix
          } | tee rapport.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport
          path: rapport.txt

  # Le README annonçait « gate hwconfig sur x86_64 : passe » — mesure locale,
  # jamais reproduite en CI. Ce job le rend vérifiable.
  gate-x86_64:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4

      - name: Gate hwconfig x86_64
        run: |
          nix build -L .#checks.x86_64-linux.hwconfig
          cat result | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Formatage
        run: nix build -L .#checks.x86_64-linux.formatting
