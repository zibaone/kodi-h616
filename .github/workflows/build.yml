name: build-aarch64

# Vérifie trois choses sur un runner ARM natif, sans nixbian ni noyau :
#   1. le disque : la fermeture tient-elle sur le runner (/mnt monté sur /nix) ?
#   2. la durée réelle de ffmpeg + kodi, comparée aux 12 h+ en émulation ;
#   3. que le gate hwconfig passe sur aarch64 (il n'avait été validé qu'en x86).
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - name: Disque — monter /mnt sur /nix si c'est un volume séparé
        run: |
          echo "=== avant ==="
          df -h / /mnt || true
          if [ -d /mnt ] && [ "$(df --output=target /mnt | tail -1)" = "/mnt" ]; then
            sudo mkdir -p /mnt/nix /nix
            sudo mount --bind /mnt/nix /nix
            echo "=== /nix monté sur /mnt ==="
          else
            echo "=== /mnt absent ou sur le même fs que / : le disque racine suffit ==="
          fi
          df -h / || true
          echo "cpu: $(nproc) | ram: $(free -g | awk '/^Mem:/{print $2}') Go"

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 4
            cores = 0

      # Pousse chaque dérivation construite vers havenos.cachix.org via le
      # post-build-hook : c'est ce qui rend l'image assemblable en local sans
      # recompiler kodi ni ffmpeg sous émulation.
      - uses: cachix/cachix-action@v17
        with:
          name: havenos
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Environnement
        run: |
          nix --version
          uname -m
          df -h /nix

      - name: Build ffmpeg v4l2-request (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.ffmpeg-v4l2request
          d=$(( $(date +%s) - s ))
          echo "| ffmpeg | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build kodi 21.3 + backport (chronométré)
        run: |
          s=$(date +%s)
          nix build -L .#packages.aarch64-linux.kodi
          d=$(( $(date +%s) - s ))
          echo "| kodi | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gate hwconfig (h264 + hevc → DRM_PRIME / HW_DEVICE_CTX / DRM)
        run: |
          s=$(date +%s)
          nix build -L .#checks.aarch64-linux.hwconfig
          cat result | tee -a "$GITHUB_STEP_SUMMARY"
          d=$(( $(date +%s) - s ))
          echo "| gate | ${d}s |" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Mesures (tailles réelles)
        run: |
          {
            echo "| paquet | taille |"
            echo "|---|---|"
            nix path-info -S .#packages.aarch64-linux.ffmpeg-v4l2request .#packages.aarch64-linux.kodi |
              awk '{printf "| %s | %.1f Mio |\n", $1, $2/1048576}'
            echo
            echo "fermeture kodi (sortie « out ») : $(nix path-info -S --json .#packages.aarch64-linux.kodi | jq -r '[.[].closureSize] | max / 1073741824 | "\(. * 100 | round / 100) Gio"')"
            echo
            df -h /nix
          } | tee rapport.txt | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rapport
          path: rapport.txt
